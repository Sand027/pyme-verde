<rect x="660" y="578" width="285" height="56" rx="8" fill="#fff" stroke="#6b5f55" stroke-width="1.2" />
<text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Arquitectura en capas con MVC</text>
<text x="30" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Cada capa solo llama a la de abajo. Las vistas reciben datos ya preparados y nunca consultan la base.</text>
<text x="50" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#355c7d"  text-anchor="start">Capa de presentación (Vista)</text>
<text x="192" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Vistas EJS  src/views</text>
<text x="497" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">CSS responsivo  public/css</text>
<text x="802" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">JavaScript del DOM  public/js</text>
<text x="50" y="262" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#a4472a"  text-anchor="start">Capa de aplicación (Controlador)</text>
<text x="192" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Rutas web y API  src/routes</text>
<text x="497" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Middleware: sesión, CSRF, roles, seguridad</text>
<text x="802" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Controladores web y API REST</text>
<text x="50" y="412" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#3f6b4c"  text-anchor="start">Capa de negocio (Modelo)</text>
<text x="192" y="461" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Servicios  src/services</text>
<text x="497" y="461" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Modelos de dominio  src/models</text>
<text x="802" y="461" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Strategy, Factory, Observer</text>
<text x="50" y="562" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#6b5f55"  text-anchor="start">Capa de persistencia</text>
<text x="192" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Repositorios  src/repositories</text>
<text x="497" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Database (Singleton, pool pg)</text>
<text x="802" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">PostgreSQL: consultas $1, $2…</text>
<text x="30" y="690" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Flujo de una petición: navegador → ruta → middleware → controlador → servicio → modelo/patrón → repositorio → PostgreSQL, y la respuesta (HTML o JSON) de regreso.</text></svg>