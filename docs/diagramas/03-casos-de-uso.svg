<text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Diagrama de casos de uso</text>
<text x="500" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">Sistema PyME Verde</text>
<text x="500" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Consultar la presentación de la PyME</text>
<text x="500" y="184" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Ver indicadores públicos y su serie</text>
<text x="500" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Leer recomendaciones y preguntas</text>
<text x="500" y="284" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Leer aviso de privacidad</text>
<text x="500" y="334" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Iniciar sesión</text>
<text x="120" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">Visitante</text>
<text x="500" y="408" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Registrar consumo, residuo o producción</text>
<text x="500" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Consultar y filtrar registros</text>
<text x="500" y="508" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Editar sus propios registros</text>
<text x="500" y="558" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Ver el tablero de indicadores</text>
<text x="500" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Consultar residuos y destinos</text>
<text x="500" y="658" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Comparar escenarios en la calculadora</text>
<text x="500" y="708" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Actualizar el avance de sus acciones</text>
<text x="500" y="758" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Agregar evidencias de avance</text>
<text x="500" y="808" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Cambiar su contraseña</text>
<text x="120" y="656" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">Colaborador</text>
<text x="500" y="882" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Editar o eliminar cualquier registro</text>
<text x="500" y="932" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Crear, editar y eliminar acciones</text>
<text x="500" y="982" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Comparar periodos, exportar CSV, imprimir</text>
<text x="500" y="1032" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Administrar usuarios y roles</text>
<text x="500" y="1082" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Configurar empresa, supuestos y metas</text>
<text x="500" y="1132" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Administrar el catálogo de conceptos</text>
<text x="500" y="1182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Consultar la bitácora de auditoría</text>
<text x="880" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">Administrador</text>
<text x="70" y="427" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">hereda</text>
<text x="150" y="953" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">hereda</text></svg>