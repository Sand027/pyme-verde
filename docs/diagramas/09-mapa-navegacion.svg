<text x="768" y="486" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">empresa, supuestos, metas</text>
<text x="978" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">Bitácora</text>
<text x="978" y="460" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">/admin/bitacora</text>
<text x="978" y="486" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">auditoría</text>
<text x="36" y="560" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Una ruta privada sin sesión lleva a /login y regresa a la página pedida al entrar. Una ruta sin permiso responde 403, aunque se escriba a mano.</text>
<text x="36" y="582" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Cerrar sesión (POST /logout) destruye la sesión en el servidor y vuelve a /login.</text></svg>