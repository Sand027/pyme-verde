<text x="138" y="486" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">comparar periodos</text>
<text x="348" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">Versión imprimible</text>
