<text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Diagrama de flujo: acceso y captura de un registro</text>
<text x="300" y="95" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#3f6b4c"  text-anchor="middle">Inicio</text>
<text x="300" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Abrir el sitio por HTTPS</text>
<text x="300" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Ver página pública e indicadores</text>
<text x="300" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">¿Iniciar sesión?</text>
<text x="300" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Escribir usuario y contraseña</text>
<text x="300" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">¿Credenciales válidas?</text>
<text x="300" y="622" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Crear sesión y mostrar panel por rol</text>
<text x="300" y="698" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Capturar un registro</text>
<text x="300" y="786" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">¿Datos válidos?</text>
<text x="300" y="882" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Guardar y registrar en bitácora</text>
<text x="300" y="965" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#3f6b4c"  text-anchor="middle">Fin</text>
<text x="720" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Seguir como visitante</text>
<text x="720" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Sumar intento fallido</text>
<text x="720" y="616" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">¿5 intentos seguidos?</text>
<text x="720" y="714" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Bloquear la cuenta 15 minutos</text>
<text x="77" y="688" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">Mostrar error</text>
<text x="77" y="706" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="middle">por campo</text>
<text x="320" y="384" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2b241e" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">Sí</text>
<text x="320" y="578" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2b241e" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">Sí</text>
<text x="320" y="838" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2b241e" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">Sí</text>
<text x="467" y="319" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2b241e" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">No</text>
<text x="467" y="513" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2b241e" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">No</text>
<text x="740" y="668" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2b241e" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">Sí</text>
<text x="885" y="603" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2b241e" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">No</text>
<text x="133" y="773" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" font-style="normal" fill="#2b241e" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">No</text>
<text x="30" y="1000" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Los datos se validan dos veces: en el navegador (atributos HTML y pv.js) y en el servidor (Validador y modelos); la base aplica además restricciones CHECK.</text></svg>