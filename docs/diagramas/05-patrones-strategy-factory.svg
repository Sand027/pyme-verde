<text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Patrones Strategy y Factory</text>
<text x="30" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Indicadores: cada fórmula es una estrategia. Residuos: cada clasificación decide los destinos válidos.</text>
<text x="155" y="109" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">IndicadorService</text>
<text x="38" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">- repos, parametros</text>
<text x="38" y="161" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ calcular(usuario, periodo)</text>
<text x="38" y="178" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ serie(id, meses)</text>
<text x="550" y="105" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">«factory»</text>
<text x="550" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">IndicadorStrategyFactory</text>
<text x="408" y="146" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">- #registro: Map&lt;clave, estrategia&gt;</text>
<text x="408" y="173" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ para(clave) «static»</text>
<text x="408" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ disponibles() «static»</text>
<text x="960" y="105" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">«abstract»</text>
<text x="960" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#2b241e"  text-anchor="middle">IndicadorStrategy</text>
<text x="828" y="154" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ calcular(contexto) «abstract»</text>
<text x="828" y="171" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ sumar(), dividir(), redondear()</text>
<text x="340" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">pide la estrategia</text>
<text x="760" y="122" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">crea</text>
<text x="115" y="319" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">TasaAprovechamiento</text>
<text x="38" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ calcular(ctx)</text>
<text x="297" y="319" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">IntensidadPorPar</text>
<text x="220" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ calcular(ctx)</text>
<text x="479" y="319" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">PromedioMensual</text>
<text x="402" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ calcular(ctx)</text>
<text x="661" y="319" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">CostoDesperdicio</text>
<text x="584" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ calcular(ctx)</text>
<text x="843" y="319" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">AvancePlan</text>
<text x="766" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ calcular(ctx)</text>
<text x="1025" y="319" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">CapacitacionPorColaborador</text>
<text x="948" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ calcular(ctx)</text>
<text x="30" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Sufijo Strategy omitido en las cajas. Agregar un indicador nuevo = agregar una clase y registrarla en la fábrica, sin tocar el servicio.</text>
<text x="155" y="465" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">«factory»</text>
<text x="155" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">RegistroFactory</text>
<text x="38" y="514" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ crear(datos, categoria) «static»</text>
<text x="550" y="465" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">«factory»</text>
<text x="550" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">DestinoStrategyFactory</text>
<text x="408" y="506" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">- #registro: Map&lt;clasificacion, …&gt;</text>
<text x="408" y="533" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ para(clasificacion) «static»</text>
<text x="960" y="465" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">«abstract»</text>
<text x="960" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="italic" fill="#2b241e"  text-anchor="middle">DestinoResiduoStrategy</text>
<text x="828" y="514" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ destinosAprovechamiento()</text>
<text x="828" y="531" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ destinoDisposicion()</text>
<text x="828" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ exigeEvidencia(): bool</text>
<text x="828" y="565" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">+ validar(datos): errores</text>
<text x="340" y="482" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">según la clasificación</text>
<text x="157.5" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">ReutilizableStrategy</text>
<text x="38" y="724" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">reutilización, donación</text>
<text x="429.5" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">ReciclableStrategy</text>
<text x="310" y="724" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">reciclaje</text>
<text x="701.5" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">ManejoEspecialStrategy</text>
<text x="582" y="724" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">coprocesamiento; exige evidencia</text>
<text x="973.5" y="699" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">NoAprovechableStrategy</text>
<text x="854" y="724" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">relleno sanitario</text>
<text x="30" y="784" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">RegistroFactory también elige la subclase de Registro (Consumo, Producción, Social, Residuo) según el tipo de categoría.</text></svg>