<text x="121" y="758" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#2b241e" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="start">actualiza la tabla y muestra el aviso</text>
<text x="56" y="816" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" font-style="normal" fill="#a4472a"  text-anchor="start">alt  [datos inválidos]</text>
<text x="56" y="838" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">Si la estrategia o el modelo devuelven errores, el servicio lanza ValidacionError y la API responde 422 { error: { codigo, mensaje, campos } };</text>
<text x="56" y="858" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">el navegador marca cada campo con su mensaje. Sin sesión: 401. Sin permiso: 403. Token CSRF ausente o distinto: 403 CSRF.</text></svg>