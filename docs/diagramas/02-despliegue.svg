<text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Diagrama de despliegue</text>
<text x="155" y="108" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">«dispositivo»</text>
<text x="155" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">Navegador web</text>
<text x="44" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">Computadora, tableta o teléfono</text>
<text x="44" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">HTML + CSS + JavaScript</text>
<text x="44" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">Cookie pv.sid (HttpOnly, Secure)</text>
<text x="44" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">Visitante, colaborador, admin</text>
<text x="510" y="108" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">«servidor»</text>
<text x="510" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">Render (servicio web)</text>
<text x="384" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">Node.js 22 + Express 4</text>
<text x="384" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">Vistas EJS y API REST /api</text>
<text x="384" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">helmet: CSP, HSTS, nosniff</text>
<text x="384" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">express-session + CSRF</text>
<text x="384" y="240" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">Redirección HTTP → HTTPS</text>
<text x="384" y="260" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">Verificación GET /salud</text>
<text x="855" y="108" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">«base de datos»</text>
<text x="855" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">Neon PostgreSQL</text>
<text x="754" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">PostgreSQL administrado</text>
<text x="754" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">9 tablas + session</text>
<text x="754" y="200" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">Conexión TLS</text>
<text x="754" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#2b241e"  text-anchor="start">(sslmode=require)</text>
<text x="510" y="348" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="middle">«código»</text>
<text x="510" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="middle">Repositorio GitHub</text>
<text x="325" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">HTTPS</text>
<text x="695" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">TLS 5432</text>
<text x="590" y="324" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">autoDeploy en cada push</text></svg>