<text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Diagrama de componentes</text>
<text x="30" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Cada componente usa solo las interfaces del componente de abajo. Las flechas punteadas indican dependencia de uso.</text>
<text x="42" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Cliente web (navegador)</text>
<text x="42" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Vistas HTML renderizadas</text>
<text x="42" y="143" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">public/js: pv.js, registros.js,</text>
<text x="42" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">calculadora.js, tablero.js y otros</text>
<text x="682" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Open-Meteo (externo)</text>
<text x="682" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Servicio web público</text>
<text x="682" y="143" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">GET /v1/forecast</text>
<text x="682" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">JSON sin clave de acceso</text>
<text x="42" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Rutas y controladores web</text>
<text x="42" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">src/routes/web.js</text>
<text x="42" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">src/controllers/web/*</text>
<text x="42" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Devuelven HTML (EJS)</text>
<text x="362" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">API REST</text>
<text x="362" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">src/routes/api.js</text>
<text x="362" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">src/controllers/api/*</text>
<text x="362" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Devuelven JSON, OpenAPI 3</text>
<text x="682" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Middleware</text>
<text x="682" y="286" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">auth.js: sesión y permisos</text>
<text x="682" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">csrf.js, seguridad.js (helmet)</text>
<text x="682" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">errores.js</text>
<text x="42" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Servicios de negocio</text>
<text x="42" y="446" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">AuthService, UsuarioService, RegistroService, IndicadorService,</text>
<text x="42" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">ResiduoService, AccionService, CalculadoraService, ReporteService,</text>
<text x="42" y="480" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">CatalogoService, ClimaService (cliente de Open-Meteo)</text>
<text x="42" y="497" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Modelos (src/models) y patrones Strategy, Factory, Observer</text>
<text x="682" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Eventos y bitácora</text>
<text x="682" y="446" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">EventBus (Observer)</text>
<text x="682" y="463" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">BitacoraObserver</text>
<text x="682" y="480" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Escucha registro.*, accion.*,</text>
<text x="682" y="497" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">sesion.* y usuario.*</text>
<text x="42" y="604" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">Repositorios</text>
<text x="42" y="626" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">BaseRepository y 8 repositorios: SQL con parámetros $1, $2…</text>
<text x="42" y="643" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">Database.getInstance() (Singleton, pool de pg)</text>
<text x="682" y="604" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" font-style="normal" fill="#2b241e"  text-anchor="start">PostgreSQL (Neon)</text>
<text x="682" y="626" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">9 tablas de dominio</text>
<text x="682" y="643" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">tabla session</text>
<text x="120" y="222" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">HTTPS: páginas</text>
<text x="400" y="207" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">fetch JSON + X-CSRF-Token</text>
<text x="660" y="340" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">filtra</text>
<text x="200" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">usa</text>
<text x="460" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">usa</text>
<text x="660" y="457" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">publica</text>
<text x="360" y="558" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">usa</text>
<text x="760" y="547" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">escribe</text>
<text x="660" y="652" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">SQL / TLS</text>
<text x="870" y="367" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55" stroke="#fff" stroke-width="4" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">HTTPS GET</text>
<text x="30" y="720" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">El navegador nunca llama a Open-Meteo directamente: ClimaService lo consulta desde el servidor, guarda la respuesta una hora</text>
<text x="30" y="740" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" font-style="normal" fill="#6b5f55"  text-anchor="start">y la expone en GET /api/publico/clima.</text></svg>